services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polizza
      POSTGRES_PASSWORD: polizza
      POSTGRES_DB: polizza_dev
    ports:
      - "5432:5432"
    volumes:
      - polizza_db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://polizza:polizza@db:5432/polizza_dev
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_TRANSPORT: console
    ports:
      - "3000:3000"
    command: sh -c "pnpm prisma migrate deploy && node server.js"

volumes:
  polizza_db:
